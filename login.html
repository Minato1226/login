<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title><登录界面></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
   
   <form id="login-form">
    <p>
       <h1>你好，欢迎登录</h1>
      <label for="username">账号:</label>
      <input type="text" id="username" autocomplete="username" placeholder="请输入账号">
     
    </p>
    <p>
      <label for="password">密码:</label>
      <input type="password" id="password" autocomplete="current-password"placeholder="请输入密码">
    </p>
    <button type:"submit">登录</button>
    <p id="message" role="status">

    </p>
   </form>
<script src="script.js">
  
</script>
</body>
</html>
